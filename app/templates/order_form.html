{% extends "base.html" %}

{% block title %}{% if order %}Edit Order{% else %}New Order{% endif %} - FastAPI Order Management{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-{% if order %}pencil-square{% else %}plus-circle{% endif %} me-2"></i>
                    {% if order %}Edit Order{% else %}Create New Order{% endif %}
                </h5>
            </div>
            <div class="card-body">
                <form method="post" action="{% if order %}/orders/{{ order.id }}/edit{% else %}/orders/new{% endif %}">
                    <div class="mb-3">
                        <label for="name" class="form-label">
                            <i class="bi bi-tag me-1"></i>Name
                        </label>
                        <input type="text" class="form-control" id="name" name="name" 
                               value="{% if order %}{{ order.name }}{% endif %}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="quantity" class="form-label">
                            <i class="bi bi-hash me-1"></i>Quantity
                        </label>
                        <input type="number" class="form-control" id="quantity" name="quantity" 
                               value="{% if order %}{{ order.quantity }}{% else %}1{% endif %}" 
                               min="1" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">
                            <i class="bi bi-text-paragraph me-1"></i>Description
                        </label>
                        <textarea class="form-control" id="description" name="description" 
                                  rows="4">{% if order %}{{ order.description or '' }}{% endif %}</textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-secondary">
                            <i class="bi bi-check-circle me-1"></i>
                            {% if order %}Update{% else %}Create{% endif %}
                        </button>
                        <a href="/" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
